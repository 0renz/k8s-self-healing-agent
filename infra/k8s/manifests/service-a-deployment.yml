apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: sample-app
  labels:
    app: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: aiops-sample-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: "service-a"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: UPSTREAM_URL
              value: "http://service-b:8001/"
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5