---
- name: Provisionar infraestrutura local do AIOps Agent
  hosts: local
  gather_facts: false
  tasks:
    - name: Verificar se minikube já está rodando
      ansible.builtin.command: minikube status
      register: minikube_status
      failed_when: false
      changed_when: false

    - name: Iniciar cluster Minikube
      ansible.builtin.command: minikube start --cpus=4 --memory=6g
      when: "'Running' not in minikube_status.stdout"

    - name: Build da imagem da aplicação de exemplo dentro do Minikube
      ansible.builtin.command: >
        minikube image build -t aiops-sample-app:local
        {{ playbook_dir }}/../../../app

    - name: Adicionar repositório Prometheus Community
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Instalar Prometheus via Helm
      kubernetes.core.helm:
        name: prometheus
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: monitoring
        create_namespace: true

    - name: Aplicar manifests da aplicação de exemplo (exceto ServiceMonitor)
      kubernetes.core.k8s:
        state: present
        src: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../../k8s/manifests/namespace.yml"
        - "{{ playbook_dir }}/../../k8s/manifests/otel-collector-configmap.yml"
        - "{{ playbook_dir }}/../../k8s/manifests/otel-collector-deployment.yml"
        - "{{ playbook_dir }}/../../k8s/manifests/otel-collector-service.yml"
        - "{{ playbook_dir }}/../../k8s/manifests/service-a-deployment.yml"
        - "{{ playbook_dir }}/../../k8s/manifests/service-a-service.yml"
        - "{{ playbook_dir }}/../../k8s/manifests/service-b-deployment.yml"
        - "{{ playbook_dir }}/../../k8s/manifests/service-b-service.yml"

    - name: Aguardar CRD do ServiceMonitor ficar disponível
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: servicemonitors.monitoring.coreos.com
      register: servicemonitor_crd
      until: servicemonitor_crd.resources | length > 0
      retries: 30
      delay: 5

    - name: Aplicar ServiceMonitor da aplicação de exemplo
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../../k8s/manifests/servicemonitor.yml"