---
- name: Reiniciar deployment em resposta a diagnóstico do agente
  hosts: local
  gather_facts: false
  vars:
    target_namespace: default
  tasks:
    - name: Registrar ação antes da execução
      ansible.builtin.debug:
        msg: "Reiniciando {{ target_deployment }} no namespace {{ target_namespace }}"

    - name: Rollout restart via módulo k8s
      kubernetes.core.k8s:
        state: patched
        kind: Deployment
        name: "{{ target_deployment }}"
        namespace: "{{ target_namespace }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
      vars:
        ansible_date_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"